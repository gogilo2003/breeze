name: Test Breeze installer on Laravel 13

on:
  pull_request:
  push:
    branches: [ '3.x' ]

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [blade, vue]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup PHP
        uses: shivammathur/setup-php@v3
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Create Laravel 13 app
        run: |
          composer create-project laravel/laravel test-app "13.*" --prefer-dist --no-interaction

      - name: Require Breeze from repository
        run: |
          cd test-app
          composer config repositories.breeze path ../
          composer require gogilo/breeze:3.x-dev --no-interaction --prefer-source
          # Allow path repository to resolve correctly by requiring the dev reference

      - name: Run Breeze installer for stack
        run: |
          cd test-app
          php artisan breeze:install ${{ matrix.stack }} || (echo 'breeze:install failed' && exit 1)

      - name: Install Node dependencies and build
        run: |
          cd test-app
          npm ci --no-audit --no-fund
          npm run build
